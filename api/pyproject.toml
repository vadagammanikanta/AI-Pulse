[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-pulse-api"
version = "0.1.0"
description = "AI Pulse — personal AI intelligence platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "structlog>=24.2.0",
    "numpy>=1.26.0",
    "rapidfuzz>=3.9.0",
    "groq>=0.9.0",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "anyio>=4.4.0",
    "respx>=0.21.0",
]

[project.scripts]
pipeline = "app.pipeline.run:cli_run"
seed = "app.tools.seed_sources:cli_seed"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
log_cli = true
log_level = "WARNING"

[tool.hatch.build.targets.wheel]
packages = ["app"]
